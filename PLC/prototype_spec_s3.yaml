meta:
  source_file: prototype_raw.py
  spec_strategy: S3-LLM
  generator: spec_generator_s3.py
  model: anthropic/claude-sonnet-4-6
  note: Rich semantic spec generated by LLM directly reading source code. Contains
    purpose, semantic_summary, preconditions, postconditions in addition to the S1
    structural fields. source_anchor is authoritative (AST-derived). May contain verbose
    or noisy semantic descriptions — use spec_simplifier_s3.py for a compressed version.
module_globals:
- hw
- ctrl
constants:
  SAFE_Z: 50000
functions:
  _hw_tick:
    purpose: Simulate one PLC scan cycle by advancing hardware state machines to their
      done/stable states.
    semantic_summary: 'Checks each hardware trigger flag (Z-axis, XY gantry, ADP aspirate
      pump, ADP dispense pump) and, if a trigger is active and the done flag is not
      yet set, marks the operation complete by updating the corresponding done flag
      and (for Z) copying the target to z_actual. This replaces the real PLC function-block
      scan loop for simulation purposes.

      '
    preconditions: null
    postconditions:
    - If hw.z_trigger was True and hw.z_done was False, hw.z_done is True, hw.z_actual
      equals hw.z_location, and hw.z_motor_stable is True.
    - If hw.xy_trigger was True and hw.xy_done was False, hw.xy_done is True.
    - If hw.adp_draw_trigger was True and hw.adp_draw_done was False, hw.adp_draw_done
      is True.
    - If hw.adp_arrange_trigger was True and hw.adp_arrange_done was False, hw.adp_arrange_done
      is True.
    inputs: []
    returns: null
    calls: null
    reads_globals:
    - hw.z_trigger
    - hw.z_done
    - hw.z_location
    - hw.xy_trigger
    - hw.xy_done
    - hw.adp_draw_trigger
    - hw.adp_draw_done
    - hw.adp_arrange_trigger
    - hw.adp_arrange_done
    writes_globals:
    - hw.z_actual
    - hw.z_done
    - hw.z_motor_stable
    - hw.xy_done
    - hw.adp_draw_done
    - hw.adp_arrange_done
    source_anchor:
      file: prototype_raw.py
      lines: 83-96
  _well_z:
    purpose: Return the Z-axis depth (in pulses) for a given well position index.
    semantic_summary: 'Looks up the provided well_pos key in the module-level _WELL_Z_DEPTH
      dictionary and returns the corresponding pulse count, defaulting to 80,000 if
      the position is not found. This encapsulates the well-geometry mapping used
      by aspirate and dispense sequences.

      '
    preconditions: null
    postconditions:
    - Returns an integer representing the Z-depth in pulses for the given well position.
    inputs:
    - name: well_pos
      type: int
      description: Zero-based index of the target well whose Z depth is required.
    returns: int
    calls: null
    reads_globals: null
    writes_globals: null
    source_anchor:
      file: prototype_raw.py
      lines: 103-104
  aspirate_from_well:
    purpose: 'Execute a complete aspirate sequence: XY positioning, Z lowering, pump
      aspiration, and Z raising to safe height.'
    semantic_summary: 'Guards execution with ctrl.autorun and ctrl.estop_ok, then
      performs four inlined trigger sequences in order: (1) clear and re-fire XY gantry
      to the target well position, (2) clear and re-fire Z-axis down to the computed
      well depth, (3) clear and re-fire the ADP draw pump with the converted volume,
      and (4) clear and re-fire Z-axis up to SAFE_Z. Each step calls _hw_tick() to
      simulate hardware completion and asserts the expected done flags before proceeding.

      '
    preconditions:
    - ctrl.autorun is True (machine is in auto-run mode).
    - ctrl.estop_ok is True (no active emergency stop).
    - hw.z_motor_stable is True before each Z move (assumed by hardware simulation).
    postconditions:
    - hw.xy_target is set to well_pos and hw.xy_done is True.
    - hw.z_actual equals the Z depth of well_pos after lowering, then equals SAFE_Z
      after raising.
    - hw.adp_draw_volume is set to int(volume_ul * 10) and hw.adp_draw_done is True.
    - hw.adp_draw_trigger is False on exit.
    - hw.z_trigger is False on exit.
    - hw.z_location equals SAFE_Z on exit.
    inputs:
    - name: well_pos
      type: int
      description: Index of the source well to aspirate from.
    - name: volume_ul
      type: float
      description: Volume to aspirate in microlitres.
    returns: null
    calls:
    - _hw_tick
    - _well_z
    reads_globals:
    - ctrl.autorun
    - ctrl.estop_ok
    - hw.xy_trigger
    - hw.xy_done
    - hw.z_trigger
    - hw.z_done
    - hw.z_motor_stable
    - hw.adp_draw_trigger
    - hw.adp_draw_done
    writes_globals:
    - hw.xy_trigger
    - hw.xy_done
    - hw.xy_target
    - hw.z_trigger
    - hw.z_done
    - hw.z_location
    - hw.adp_draw_trigger
    - hw.adp_draw_done
    - hw.adp_draw_volume
    source_anchor:
      file: prototype_raw.py
      lines: 109-160
  dispense_to_well:
    purpose: 'Execute a complete dispense sequence: XY positioning, Z lowering, pump
      dispensing, and Z raising to safe height.'
    semantic_summary: 'Guards execution with ctrl.autorun and ctrl.estop_ok, then
      performs four inlined trigger sequences: (1) clear and re-fire XY gantry to
      the target well position, (2) clear and re-fire Z-axis down to the computed
      well depth, (3) clear the arrange volume to zero then set it to the converted
      volume and fire the ADP arrange pump (0→nonzero transition required by driver),
      and (4) clear and re-fire Z-axis up to SAFE_Z. Each step calls _hw_tick() to
      simulate hardware completion and asserts the expected done flags before proceeding.

      '
    preconditions:
    - ctrl.autorun is True (machine is in auto-run mode).
    - ctrl.estop_ok is True (no active emergency stop).
    - hw.z_motor_stable is True before each Z move (assumed by hardware simulation).
    - The ADP pump is assumed to contain liquid (filled by a prior aspirate_from_well
      call via shared hw.adp_draw_done state).
    postconditions:
    - hw.xy_target is set to well_pos and hw.xy_done is True.
    - hw.z_actual equals the Z depth of well_pos after lowering, then equals SAFE_Z
      after raising.
    - hw.adp_arrange_volume is set to int(volume_ul * 10) and hw.adp_arrange_done
      is True.
    - hw.adp_arrange_trigger is False on exit.
    - hw.z_trigger is False on exit.
    - hw.z_location equals SAFE_Z on exit.
    inputs:
    - name: well_pos
      type: int
      description: Index of the destination well to dispense into.
    - name: volume_ul
      type: float
      description: Volume to dispense in microlitres.
    returns: null
    calls:
    - _hw_tick
    - _well_z
    reads_globals:
    - ctrl.autorun
    - ctrl.estop_ok
    - hw.xy_trigger
    - hw.xy_done
    - hw.z_trigger
    - hw.z_done
    - hw.z_motor_stable
    - hw.adp_arrange_trigger
    - hw.adp_arrange_done
    - hw.adp_arrange_volume
    - hw.adp_draw_done
    writes_globals:
    - hw.xy_trigger
    - hw.xy_done
    - hw.xy_target
    - hw.z_trigger
    - hw.z_done
    - hw.z_location
    - hw.adp_arrange_trigger
    - hw.adp_arrange_done
    - hw.adp_arrange_volume
    source_anchor:
      file: prototype_raw.py
      lines: 163-220
  wash_tips:
    purpose: Perform a multi-cycle tip wash by repeatedly aspirating and dispensing
      at the wash station.
    semantic_summary: 'Guards execution with ctrl.autorun and ctrl.estop_ok, then
      iterates for the requested number of cycles. In each cycle it calls aspirate_from_well
      followed by dispense_to_well, both targeting wash_pos with wash_volume_ul, producing
      alternating aspirate/dispense passes at the wash location.

      '
    preconditions:
    - ctrl.autorun is True (machine is in auto-run mode).
    - ctrl.estop_ok is True (no active emergency stop).
    postconditions:
    - aspirate_from_well and dispense_to_well have each been called exactly 'cycles'
      times with wash_pos and wash_volume_ul.
    - All hardware state postconditions of aspirate_from_well and dispense_to_well
      hold after the final cycle.
    inputs:
    - name: wash_pos
      type: int
      description: Well index of the wash station.
    - name: wash_volume_ul
      type: float
      description: Volume per wash aspiration/dispense cycle in microlitres.
    - name: cycles
      type: int
      description: Number of aspirate+dispense wash cycles to perform (default 3).
    returns: null
    calls:
    - aspirate_from_well
    - dispense_to_well
    reads_globals:
    - ctrl.autorun
    - ctrl.estop_ok
    writes_globals: null
    source_anchor:
      file: prototype_raw.py
      lines: 223-232
